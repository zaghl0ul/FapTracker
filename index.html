<!DOCTYPE html>
<html lang="en" data-theme="dark-amber">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FapTracker™</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: var(--color-bg);
        color: var(--color-text-base);
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      
      :root, [data-theme="dark-amber"] {
        --color-bg: #0f172a; /* slate-900 */
        --color-bg-secondary: #1e293b; /* slate-800 */
        --color-bg-tertiary: #334155; /* slate-700 */
        --color-border: #334155; /* slate-700 */
        --color-border-dashed: #475569; /* slate-600 */
        --color-text-base: #e2e8f0; /* slate-200 */
        --color-text-muted: #94a3b8; /* slate-400 */
        --color-text-subtle: #64748b; /* slate-500 */
        --color-primary: #f59e0b; /* amber-500 */
        --color-primary-accent: #fbbf24; /* amber-400 */
        --color-primary-hover: #d97706; /* amber-600 */
        --color-primary-content: #1e293b; /* slate-800 */
        --color-gradient-from: #fbbf24; /* amber-400 */
        --color-gradient-to: #f59e0b; /* amber-500 */
        --color-danger: #f43f5e; /* red-500 */
        --color-danger-hover: #e11d48; /* red-600 */
      }
      
      [data-theme="synthwave"] {
        --color-bg: #1a0b2e;
        --color-bg-secondary: #2c1d44;
        --color-bg-tertiary: #442b6b;
        --color-border: #442b6b;
        --color-border-dashed: #5a3a8a;
        --color-text-base: #e6ddeb;
        --color-text-muted: #b9a8d4;
        --color-text-subtle: #8777a8;
        --color-primary: #ff00ff; /* magenta */
        --color-primary-accent: #00ffff; /* cyan */
        --color-primary-hover: #e600e6;
        --color-primary-content: #1a0b2e;
        --color-gradient-from: #ff00ff;
        --color-gradient-to: #00ffff;
        --color-danger: #ff5555;
        --color-danger-hover: #ff2222;
      }

      [data-theme="arctic"] {
        --color-bg: #f9fafb; /* gray-50 */
        --color-bg-secondary: #ffffff;
        --color-bg-tertiary: #e5e7eb; /* gray-200 */
        --color-border: #e5e7eb; /* gray-200 */
        --color-border-dashed: #d1d5db; /* gray-300 */
        --color-text-base: #1f2937; /* gray-800 */
        --color-text-muted: #4b5563; /* gray-600 */
        --color-text-subtle: #6b7280; /* gray-500 */
        --color-primary: #3b82f6; /* blue-500 */
        --color-primary-accent: #60a5fa; /* blue-400 */
        --color-primary-hover: #2563eb; /* blue-600 */
        --color-primary-content: #ffffff;
        --color-gradient-from: #60a5fa; /* blue-400 */
        --color-gradient-to: #3b82f6; /* blue-500 */
        --color-danger: #ef4444; /* red-500 */
        --color-danger-hover: #dc2626; /* red-600 */
      }
      
      [data-theme="forest"] {
        --color-bg: #1a2e29;
        --color-bg-secondary: #2d4a43;
        --color-bg-tertiary: #41685f;
        --color-border: #41685f;
        --color-border-dashed: #588a7e;
        --color-text-base: #d4e0dd;
        --color-text-muted: #a7bfb9;
        --color-text-subtle: #7a9c92;
        --color-primary: #f58549;
        --color-primary-accent: #ffab70;
        --color-primary-hover: #d16e34;
        --color-primary-content: #1a2e29;
        --color-gradient-from: #ffab70;
        --color-gradient-to: #f58549;
        --color-danger: #e96d76;
        --color-danger-hover: #c75660;
      }

    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.1.0/",
    "react": "https://esm.sh/react@^19.1.0",
    "react-dom/": "https://esm.sh/react-dom@^19.1.0/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-[--color-bg] text-[--color-text-base]">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
